services:
  termit_db:
    container_name: 'termit_db'
    image: postgis/postgis:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8888:5432'
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASS}
    volumes:
      - postgis_db_data:/var/lib/postgresql/data

  termit_backend:
    container_name: 'termit_backend'
    restart: unless-stopped
    build:
      context: .
    ports:
      - '127.0.0.1:8989:8000'
    env_file:
      - ./.env
    volumes:
      - ./:/user/app
    depends_on:
      - termit_db

  redis:
    image: redis:latest
    container_name: 'redis'
    restart: unless-stopped
    command: redis-server --bind 0.0.0.0 --protected-mode yes --requirepass ${REDIS_PASSWORD:-termit_redis_local}
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  postgis_db_data:
